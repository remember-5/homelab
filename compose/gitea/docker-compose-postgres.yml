networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:28.4.0
    container_name: gitea
    restart: always
    environment:
      # Time zone used inside the container.
      - TZ=Asia/Shanghai
      # Numeric user and group IDs for Gitea and its mounted /data directory.
      - USER_UID=1000
      - USER_GID=1000
      # Audit Logging
      - GITEA__audit__RECORD_OUTPUT=database
      - GITEA__audit__RETENTION_DAYS=30
      # Connect to the PostgreSQL service over the Compose network.
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      # Database name, login role, and required password used by Gitea.
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD:?Set GITEA_DB_PASSWORD in .env}
      # Hostname and full URL that users access. Set both for your Tunnel hostname.
      - GITEA__server__DOMAIN=127.0.0.1
      - GITEA__server__ROOT_URL=http://127.0.0.1:3000/
      # HTTP listener inside the container. Cloudflare terminates public HTTPS.
      - GITEA__server__PROTOCOL=http
      - GITEA__server__HTTP_ADDR=0.0.0.0
      - GITEA__server__HTTP_PORT=3000
      # Enable SSH Git access and advertise the LAN address and host port in clone URLs.
      - GITEA__server__DISABLE_SSH=false
      - GITEA__server__SSH_DOMAIN=192.168.123.2
      - GITEA__server__SSH_PORT=222
      # Disable self-registration and require sign-in to browse.
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      # Send session cookies over HTTPS only.
      - GITEA__session__COOKIE_SECURE=false
      # Disable OpenID sign-in and account registration.
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      # Disable the interactive API documentation.
      - GITEA__api__ENABLE_SWAGGER=false
    networks:
      - gitea
    volumes:
      - /mnt/user/appdata/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    labels:
      # unraid 使用
      - net.unraid.docker.webui=http://[IP]:[PORT:3000]
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/png/gitea.png
      - net.unraid.docker.shell=/bin/sh
      # homepage 使用
      - homepage.group=Observability
      - homepage.name=Gitea
      - homepage.icon=gitea.png
      - homepage.href=http://192.168.123.2:3000
      - homepage.description=Git server
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.7
    container_name: gitea-postgres
    restart: always
    environment:
      # Time zone used inside the container.
      - TZ=Asia/Shanghai
      # Initial PostgreSQL superuser and its password.
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD:?Set GITEA_DB_PASSWORD in .env}
      # Database created when the PostgreSQL data directory is initialized.
      - POSTGRES_DB=gitea
    networks:
      - gitea
    volumes:
      - /mnt/user/appdata/gitea/postgres:/var/lib/postgresql
    labels:
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/png/postgresql.png
      - net.unraid.docker.shell=/bin/sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
