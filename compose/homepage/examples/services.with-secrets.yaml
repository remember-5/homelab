# Copy selected widget blocks into config/services.yaml after setting .env secrets.

- System:
    - Unraid:
        icon: unraid.png
        href: "http://192.168.123.2"
        description: NAS and Docker host
        widget:
          type: unraid
          url: "http://192.168.123.2"
          key: "{{HOMEPAGE_VAR_UNRAID_API_KEY}}"
          fields:
            - cpu
            - memoryPercent
            - arrayUsedPercent
            - notifications

- Automation:
    - Home Assistant:
        icon: home-assistant.png
        href: "http://192.168.123.2:8123"
        description: Smart home
        widget:
          type: homeassistant
          url: "http://192.168.123.2:8123"
          key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_TOKEN}}"
          fields:
            - people_home
            - lights_on
            - switches_on

- Network:
    - Pi-hole:
        icon: pi-hole.png
        href: "http://192.168.123.2:8080/admin"
        description: DNS and ad blocking
        widget:
          type: pihole
          url: "http://192.168.123.2:8080"
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
          fields:
            - queries
            - blocked
            - blocked_percent
            - gravity

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: "http://192.168.123.2:8081"
        description: Torrent client
        widget:
          type: qbittorrent
          url: "http://192.168.123.2:8081"
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
          fields:
            - leech
            - download
            - seed
            - upload
