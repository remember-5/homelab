services:
  xinference:
    image: xprobe/xinference:v3.1.0
    restart: always
    container_name: xinference
    environment:
      - XINFERENCE_HOME=/data
      - TZ=Asia/Shanghai
      # Proxy configuration template
      # - http_proxy=http://127.0.0.1:1080
      # - https_proxy=http://127.0.0.1:1080
      # - no_proxy=localhost,127.0.0.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    ports:
      - 9997:9997
    volumes:
      - ./data:/data
    command: xinference-local -H 0.0.0.0
