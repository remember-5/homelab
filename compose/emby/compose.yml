services:
  embyserver:
    image: amilys/embyserver:latest
    container_name: embyserver
    privileged: true
    restart: unless-stopped
    environment:
      - UID=0
      - GID=0
      - GIDLIST=0
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HTTP_PROXY=http://192.168.123.2:7890
      - HTTPS_PROXY=http://192.168.123.2:7890
      - NO_PROXY=127.0.0.1,localhost,192.168.123.0/24
    ports:
      - "8096:8096"
    volumes:
      - /mnt/user/files/emby/config:/config
      - /mnt/user/files/emby/data:/data
      - /mnt/user/files/emby/strm:/strm
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    labels:
      - net.unraid.docker.webui=http://[IP]:[PORT:8096]
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/png/emby.png
      - net.unraid.docker.shell=/bin/sh
      - homepage.group=Media
      - homepage.name=Emby
      - homepage.icon=emby.png
      - homepage.href=http://192.168.123.2:8096
      - homepage.description=Media server
